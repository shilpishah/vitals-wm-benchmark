# Declarative EpisodeSpec -- the corpus regenerates from this alone.
# 2026-09, billiards/multi-collision scoping: a chained, 3-body extension
# of collision.yaml's own single pairwise impact -- cue strikes ball A,
# ball A's own post-impact motion then carries it into ball B. See
# scenes/billiards.xml's own module comment for the full scene-design
# reasoning (why 12 m/s, why a 2.0m second gap, both found via a real
# MuJoCo rollout sweep, not assumed).
name: billiards
scene: scenes/billiards.xml
target_property: P4
band: I
lam: 2.0                  # starting point, matching collision.yaml's own post-recalibration value
                           # (raised there after GATE 2 found real reconstruction noise tripping R3
                           # near the collision moment at lam=1.0) -- NOT yet independently recalibrated
                           # for this scene's own two-impact timing variance; revisit empirically once
                           # GATE 1a/1b have real numbers, same discipline collision.yaml's own lam
                           # change already used, don't just carry the number over unchecked forever.
n_reference: 30            # M -- collision.yaml's own starting value; may need raising (M2.5's own
                           # precedent: R2's M went 30->100 once real numbers showed 30 wasn't enough
                           # for a 3-channel false-termination budget) once this scene's own GATE 1a
                           # false-termination rate is actually measured, not assumed adequate.
horizon_s: 4.0             # both impacts complete by ~0.6s in every tested seed -- leaves 3+s of real
                           # post-impact runway for R3/R4 to actually have something to score.
fps: 30
seed: 0
perturb_mode: velocity_x_only   # confines Sigma to the cue's own along-track speed -- a lateral (y)
                                 # nudge could make the cue miss ball A entirely (collision.yaml's own
                                 # identical reasoning), and here ALSO risks ball A missing ball B.
track_all_objects: true         # 2026-09: the SEPARATE, explicit opt-in (EpisodeSpec/VideoWorldModel,
                                 # NOT target_property=="P3", NOT K alone) that makes real-model
                                 # reconstruction track all three bodies -- scoring only the cue ball
                                 # here (collision.yaml's own v1 limit) would make the entire POINT of
                                 # this scene (does momentum correctly propagate through the chain)
                                 # unmeasurable for real models. See VideoWorldModel's own docstring.
